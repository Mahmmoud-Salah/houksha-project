name: Build and push Docker image to ACR

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/docker-build-push-acr.yml"
  workflow_dispatch: {}

env:
  # TODO: replace with your ACR login server, e.g. myregistry.azurecr.io
  ACR_LOGIN_SERVER: ${{ secrets.ACR_USERNAME }}.azurecr.io
  IMAGE_NAME: houksha-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
